<style>/* STS ERP Design System — generated from tokens.json */

  --shadow-sheet: 0 -8px 32px rgba(14, 23, 38, 0.16);
}
[data-theme="dark"] {
  --surface: #0b0d12;
  --surface-raised: #14171e;
  --surface-sunken: #1c2029;
  --logo-plate: #ffffff;
  --line: #252a35;
  --line-strong: #5f6b7e;
  --ink: #eef1f6;
  --ink-muted: #9ba5b5;
  --ink-faint: #8a93a3;
  --navy: #8ab4f0;
  --navy-strong: #b4d0f7;
  --navy-soft: #172338;
  --on-navy: #07111d;
  --leaf: #6fd095;
  --leaf-soft: #11291c;
  --cyan: #1bbce8;
  --warn: #f2c063;
  --warn-soft: #36290f;
  --bad: #ff8a80;
  --bad-soft: #3b1a18;

  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-card: 0 0 0 1px rgba(255, 255, 255, 0.07);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 32px rgba(0, 0, 0, 0.5);
  --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, 0.6);
}
[data-theme="floor"] {
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-sunken: #eceff3;
  --logo-plate: #ffffff;
  --line: #3b4756;
  --line-strong: #1b2530;
  --ink: #000000;
  --ink-muted: #26303c;
  --ink-faint: #3a4552;
  --navy: #002a52;
  --navy-strong: #001a33;
  --navy-soft: #d9e5f3;
  --on-navy: #ffffff;
  --leaf: #004d24;
  --leaf-soft: #d7eedf;
  --cyan: #007aa3;
  --warn: #5c3700;
  --warn-soft: #fbe6bd;
  --bad: #8c0f09;
  --bad-soft: #f9d6d2;
  --on-bad: #ffffff;
  --hold: #3d2385;
  --hold-soft: #e3daf7;
  --deal-indent: #004a78;
  --deal-resale: #6e3400;
  --deal-fab: #5c2052;
  --deal-service: #004d45;
  --focus: #0040a0;
  --link: var(--navy);
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-card: 0 0 0 2px #000000;
  --shadow-pop: 0 0 0 2px #000000;
  --shadow-sheet: 0 0 0 2px #000000;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;
  --control-sm: 30px;
  --control-md: 38px;
  --control-touch: 48px;
  --control-floor: 64px;
  --row-compact: 36px;
  --row-default: 48px;
  --icon-chip: 32px;
  --rail-width: 240px;
  --rail-collapsed: 68px;
  --topbar-height: 60px;
  --tabbar-height: 68px;
  --bp-phone: 0px;
  --bp-tablet: 600px;
  --bp-desktop: 1024px;
  --bp-wide: 1440px;
  --font-sans: Geist, "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-deva: "IBM Plex Sans Devanagari", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
}
.display { font-family: var(--font-sans); font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em; }
.kpi { font-family: var(--font-sans); font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: -0.03em; }
.title { font-family: var(--font-sans); font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }

.body { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }
.body-strong { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; }
.label { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; }
.small { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 400; }
.body-touch { font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 400; }
.doc-id { font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 500; }
.code { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 400; }
.floor-title { font-family: var(--font-sans); font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; }
.floor-body { font-family: var(--font-sans); font-size: 20px; line-height: 28px; font-weight: 500; }
.floor-action { font-family: var(--font-sans); font-size: 20px; line-height: 24px; font-weight: 600; }
.floor-mr { font-family: var(--font-deva); font-size: 16px; line-height: 24px; font-weight: 500; }

<style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@500&display=swap");

/* STS ERP components · prefix sts- · every value from tokens.css · icons: Lucide (<i data-lucide="name">) */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; background: var(--surface); color: var(--ink); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
svg.lucide { width: 1.15em; height: 1.15em; stroke-width: 1.75; flex: none; }
.sts-pad { padding: var(--space-5); }
.sts-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.sts-stack { display: flex; flex-direction: column; gap: var(--space-4); }
.sts-spread { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.sts-muted { color: var(--ink-muted); }
.sts-num { font-variant-numeric: tabular-nums; }
.sts-code { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.sts-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); }

/* ---------------------------------------------------------------- Card */
.sts-card { background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-5); min-width: 0; }
.sts-card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-4); font: 600 15px/22px var(--font-sans); letter-spacing: -0.01em; }

/* ---------------------------------------------------------------- Icon chip */
.sts-ichip { display: inline-grid; place-items: center; width: var(--icon-chip); height: var(--icon-chip); border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink-muted); flex: none; font-size: 16px; }
.sts-ichip.is-navy { background: var(--navy-soft); color: var(--navy); } .sts-ichip.is-ok { background: var(--leaf-soft); color: var(--leaf); }
.sts-ichip.is-warn { background: var(--warn-soft); color: var(--warn); } .sts-ichip.is-bad { background: var(--bad-soft); color: var(--bad); }
.sts-ichip.is-hold { background: var(--hold-soft); color: var(--hold); }
.sts-ichip.is-lg { width: 44px; height: 44px; border-radius: var(--radius-lg); font-size: 20px; }

/* ---------------------------------------------------------------- Button */
.sts-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-md); padding: 0 14px;
  border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--ink);
  font: 500 14px/20px var(--font-sans); cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-card); transition: background .12s, transform .06s; }
.sts-btn:hover { background: var(--surface-sunken); }
.sts-btn:active { transform: translateY(1px); }
.sts-btn-primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.sts-btn-primary:hover { background: var(--navy-strong); }
.sts-btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-muted); }
.sts-btn-ghost:hover { background: var(--surface-sunken); color: var(--ink); }
.sts-btn-danger { background: var(--bad-soft); border-color: transparent; box-shadow: none; color: var(--bad); }
.sts-btn[disabled] { background: var(--surface-sunken); border-color: transparent; box-shadow: none; color: var(--ink-faint); cursor: not-allowed; }
.sts-btn-icon { width: var(--control-md); padding: 0; }
.sts-btn-sm { height: var(--control-sm); padding: 0 10px; font-size: 13px; border-radius: var(--radius-sm); }
.sts-btn-touch { height: var(--control-touch); padding: 0 20px; font-size: 16px; border-radius: var(--radius-lg); }
.sts-btn-floor { height: var(--control-floor); padding: 0 24px; font: 600 20px/24px var(--font-sans); border-radius: var(--radius-lg); width: 100%; }
.sts-kbd { display: inline-flex; align-items: center; height: 20px; font: 500 11px/1 var(--font-mono); padding: 0 6px; border-radius: 6px; background: var(--surface-sunken); color: var(--ink-muted); }
.sts-btn-primary .sts-kbd { background: var(--navy-strong); color: var(--on-navy); }
.sts-seg { display: inline-flex; padding: 3px; border-radius: var(--radius-md); background: var(--surface-sunken); gap: 2px; }
.sts-seg button { border: 0; background: transparent; color: var(--ink-muted); font: 500 13px/20px var(--font-sans); padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.sts-seg button.is-on { background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-card); }

/* ---------------------------------------------------------------- Status pill */
.sts-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: var(--radius-pill);
  font: 500 12px/16px var(--font-sans); white-space: nowrap; background: var(--surface-sunken); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.sts-pill svg.lucide { width: 13px; height: 13px; stroke-width: 2.25; }
.sts-pill-ok { background: var(--leaf-soft); color: var(--leaf); } .sts-pill-warn { background: var(--warn-soft); color: var(--warn); }
.sts-pill-hold { background: var(--hold-soft); color: var(--hold); } .sts-pill-info { background: var(--navy-soft); color: var(--navy); }
.sts-pill-bad { background: var(--bad); color: var(--on-bad); } .sts-pill-bad-soft { background: var(--bad-soft); color: var(--bad); }

/* ---------------------------------------------------------------- Deal chip */
.sts-deal { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 3px; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 500 12px/16px var(--font-sans); white-space: nowrap; }
.sts-deal b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 10px/1 var(--font-sans); color: var(--surface-raised); }
.sts-deal-indent b { background: var(--deal-indent); } .sts-deal-resale b { background: var(--deal-resale); }
.sts-deal-fab b { background: var(--deal-fab); } .sts-deal-service b { background: var(--deal-service); }

/* ---------------------------------------------------------------- Stepper (lifecycle) */
.sts-stepper { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sts-stepper-top { display: flex; align-items: baseline; gap: var(--space-2); font: 500 13px/18px var(--font-sans); }
.sts-stepper-top b { font-weight: 600; } .sts-stepper-top span { color: var(--ink-muted); }
.sts-steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.sts-steps li { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--surface-sunken); position: relative; font-size: 0; }
.sts-steps li.is-done { background: var(--leaf); }
.sts-steps li.is-current { background: var(--navy); }
.sts-steps li.is-blocked { background: var(--bad); }
.sts-steps li.is-hold { background: repeating-linear-gradient(135deg, var(--hold) 0 4px, var(--hold-soft) 4px 8px); }
.sts-steps.is-labelled li { height: auto; background: none; padding-top: 14px; font: 500 12px/16px var(--font-sans); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sts-steps.is-labelled li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: var(--radius-pill); background: var(--surface-sunken); }
.sts-steps.is-labelled li.is-done { color: var(--ink-muted); } .sts-steps.is-labelled li.is-done::before { background: var(--leaf); }
.sts-steps.is-labelled li.is-current { color: var(--ink); font-weight: 600; } .sts-steps.is-labelled li.is-current::before { background: var(--navy); }
.sts-steps.is-labelled li.is-blocked { color: var(--bad); font-weight: 600; } .sts-steps.is-labelled li.is-blocked::before { background: var(--bad); }
.sts-steps.is-labelled li.is-hold { color: var(--hold); font-weight: 600; } .sts-steps.is-labelled li.is-hold::before { background: repeating-linear-gradient(135deg, var(--hold) 0 4px, var(--hold-soft) 4px 8px); }

/* ---------------------------------------------------------------- Ring + meter */
.sts-ring { position: relative; display: inline-grid; place-items: center; width: 56px; height: 56px; flex: none; }
.sts-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.sts-ring .trk { fill: none; stroke: var(--surface-sunken); stroke-width: 4; }
.sts-ring .val { fill: none; stroke: var(--leaf); stroke-width: 4; stroke-linecap: round; }
.sts-ring .flr { fill: none; stroke: var(--ink); stroke-width: 7; }
.sts-ring.is-warn .val { stroke: var(--warn); } .sts-ring.is-bad .val { stroke: var(--bad); } .sts-ring.is-navy .val { stroke: var(--navy); } .sts-ring.is-hold .val { stroke: var(--hold); }
.sts-ring b { position: relative; font: 600 14px/1 var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: center; }
.sts-ring b small { display: block; font: 500 9px/12px var(--font-sans); color: var(--ink-muted); letter-spacing: 0; }
.sts-ring.is-lg { width: 132px; height: 132px; } .sts-ring.is-lg .trk, .sts-ring.is-lg .val { stroke-width: 3; } .sts-ring.is-lg b { font-size: 30px; } .sts-ring.is-lg b small { font-size: 12px; line-height: 18px; margin-top: 4px; }
.sts-meter { height: 10px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; display: flex; gap: 2px; }
.sts-meter i { display: block; height: 100%; }
.sts-meter i:first-child { border-radius: var(--radius-pill) 0 0 var(--radius-pill); } .sts-meter i:last-child { border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }
.sts-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.sts-legend span { display: inline-flex; align-items: center; gap: 6px; } .sts-legend i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
.sts-legend b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.c-navy { background: var(--navy); } .c-cyan { background: var(--cyan); } .c-leaf { background: var(--leaf); } .c-warn { background: var(--warn); } .c-hold { background: var(--hold); } .c-trk { background: var(--line-strong); }

/* ---------------------------------------------------------------- Metric */
.sts-metric { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sts-metric-v { display: flex; align-items: baseline; gap: var(--space-2); font: 600 32px/36px var(--font-sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sts-metric-v small { font-size: 15px; font-weight: 500; color: var(--ink-muted); letter-spacing: -0.01em; }
.sts-delta { display: inline-flex; align-items: center; gap: 2px; font: 500 12px/16px var(--font-sans); padding: 2px 6px; border-radius: 6px; letter-spacing: 0; }
.sts-delta svg.lucide { width: 12px; height: 12px; }
.sts-delta.is-up { background: var(--leaf-soft); color: var(--leaf); } .sts-delta.is-down { background: var(--bad-soft); color: var(--bad); }
.sts-spark { width: 100%; height: 36px; display: block; color: var(--navy); }
.sts-spark polyline { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sts-spark polygon { fill: currentColor; opacity: .08; }
.sts-spark circle { fill: currentColor; }

/* ---------------------------------------------------------------- Clock */
.sts-clocks { display: flex; flex-direction: column; }
.sts-clock { display: flex; align-items: center; gap: var(--space-3); padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.sts-clock:first-child { border-top: 0; padding-top: 0; } .sts-clock:last-child { padding-bottom: 0; }
.sts-clock .sts-ring { width: 44px; height: 44px; } .sts-clock .sts-ring b { font-size: 13px; }
.sts-clock-t { flex: 1; min-width: 0; } .sts-clock-t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sts-clock-t span { font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* ---------------------------------------------------------------- Record header */
.sts-rec { background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.sts-rec-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; }
.sts-rec-id { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.sts-rec-id > div { min-width: 0; }
.sts-docid { display: flex; align-items: center; gap: 8px; font: 500 13px/18px var(--font-mono); color: var(--ink-muted); flex-wrap: wrap; }
.sts-rec-title { font: 600 22px/28px var(--font-sans); letter-spacing: -0.02em; margin: 2px 0 0; text-wrap: balance; }
.sts-next { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.sts-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--space-4); }
.sts-fact { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sts-fact b { font: 600 18px/24px var(--font-sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sts-fact b.is-ok { color: var(--leaf); } .sts-fact b.is-warn { color: var(--warn); } .sts-fact b.is-bad { color: var(--bad); }
.sts-links { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.sts-links a { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink); text-decoration: none; font: 500 13px/18px var(--font-sans); }
.sts-links a:hover { background: var(--navy-soft); color: var(--navy); }
.sts-links a b { font-weight: 600; font-variant-numeric: tabular-nums; } .sts-links a svg { color: var(--ink-muted); }
.sts-links a.is-alert { background: var(--bad-soft); color: var(--bad); } .sts-links a.is-alert svg { color: var(--bad); }

/* ---------------------------------------------------------------- Field */
.sts-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
.sts-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sts-field > label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.sts-input-w { position: relative; display: flex; align-items: center; }
.sts-input { height: 40px; padding: 0 36px 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--ink); font: 400 14px/20px var(--font-sans); width: 100%; transition: border-color .12s, box-shadow .12s; }

  };

  class Block extends Error {
    constructor(rule, title, chips, why, fix) { super(title); this.block = true; this.rule = rule; this.title = title; this.chips = chips || []; this.why = why || ""; this.fix = fix || null; }
  }
  class Invalid extends Error { constructor(m) { super(m); this.invalid = true; } }

  const ACCT = { BANK: "Bank (Axis, Thane)", DEBTORS: "Sundry debtors", CREDITORS: "Sundry creditors", SALES: "Sales – goods", SALES_SVC: "Sales – services",
    COMMISSION: "Commission income", OUT_CGST: "Output CGST", OUT_SGST: "Output SGST", OUT_IGST: "Output IGST", IN_CGST: "Input CGST", IN_SGST: "Input SGST",
    IN_IGST: "Input IGST", PURCHASES: "Purchases", JOBWORK: "Job-work charges", ADV_CUST: "Advances from customers", CAPITAL: "Capital & reserves",
    STOCK_OPEN: "Opening stock", CN: "Sales returns / credit notes",
    EXP_RENT: "Rent", EXP_POWER: "Power & fuel", EXP_SALARY: "Salaries & wages", EXP_TRAVEL: "Travel & conveyance", EXP_FREIGHT: "Freight & transport", EXP_OFFICE: "Office & other expenses" };

  function createEngine(state) {
    const S = state || { meta: {} };
    COLS.forEach(c => { if (!S[c]) S[c] = {}; });
    S.meta = Object.assign({ today: "2026-11-06", seq: {}, blocks: [], company: {}, fyTurnoverCr: 1.2 }, S.meta || {});
    let dirty = new Set();
    const touch = (c, id) => dirty.add(c + "/" + id);
    const today = () => S.meta.today;
    const get = (c, id) => S[c][id];
    const need = (c, id) => { const r = S[c][id]; if (!r) throw new Invalid(`${LABEL[c] || c} ${id} not found`); return r; };
    const put = (c, r) => { S[c][r.id] = r; touch(c, r.id); return r; };
    const log = (rec, text, who, kind) => { rec.log = rec.log || []; rec.log.unshift({ at: today(), text, who: who || "System", kind: kind || "info" }); if (rec.log.length > 40) rec.log.length = 40; };
    const link = (a, ac, b, bc) => { a.refs = a.refs || []; b.refs = b.refs || []; if (!a.refs.some(x => x.c === bc && x.id === b.id)) a.refs.push({ c: bc, id: b.id }); if (!b.refs.some(x => x.c === ac && x.id === a.id)) b.refs.push({ c: ac, id: a.id }); };

    function nextNo(series, date, pad = 3) {
      const fy = fyOf(date || today()); const key = series + "/" + fy;
      S.meta.seq[key] = (S.meta.seq[key] || 0) + 1; touch("meta", "main");
      const n = String(S.meta.seq[key]).padStart(pad, "0");
      return { id: `${series}-${fy}-${n}`, no: `${series}/${fy}/${n}` };
    }
    function block(rule, title, chips, why, fix, ctx) {
      const b = new Block(rule, title, chips, why, fix);
      S.meta.blocks.unshift({ at: today(), rule, title, chips, why, who: (ctx && ctx.role) || "", ref: (ctx && ctx.ref) || "" });
      if (S.meta.blocks.length > 120) S.meta.blocks.length = 120; touch("meta", "main");
      return b;
    }

    // ---------------------------------------------------------------- masters & lookups
    const party = id => need("parties", id);
    const item = id => need("items", id);
    const intra = p => (p.state || "MH") === "MH";
    const isDirector = ctx => ctx && ctx.role === "director";

    function upsert(c, data) {
      if (!data.id) throw new Invalid("id required");
      const r = Object.assign(get(c, data.id) || {}, clone(data)); return put(c, r);
    }

    // ---------------------------------------------------------------- stock
    function stock(itemId, loc, status) {
      let q = 0; for (const m of Object.values(S.moves)) if (m.item === itemId && (!loc || m.loc === loc) && (!status || m.status === status)) q += m.qty;
      return r2(q);
    }
    function stockTable() {
      const t = {}; for (const m of Object.values(S.moves)) { const k = m.item + "|" + m.loc + "|" + m.status; t[k] = r2((t[k] || 0) + m.qty); }
      return Object.entries(t).filter(([, q]) => Math.abs(q) > 1e-9).map(([k, q]) => { const [i, l, s] = k.split("|"); return { item: i, loc: l, status: s, qty: q }; });
    }
    function move(itemId, qty, loc, status, ref, date, lot) {
      const id = "MV-" + (S.meta.mv = (S.meta.mv || 0) + 1); touch("meta", "main");
      return put("moves", { id, date: date || today(), item: itemId, qty: r2(qty), loc, status, ref, lot: lot || "" });
    }
    function lotsOf(itemId, loc) {
      const by = {}; for (const m of Object.values(S.moves)) if (m.item === itemId && m.loc === loc && m.status === "avail") by[m.lot || ""] = r2((by[m.lot || ""] || 0) + m.qty);
      return Object.entries(by).filter(([, q]) => q > 1e-9).map(([lot, q]) => ({ lot, q }));
    }
    function issueFIFO(itemId, qty, loc, ref, date) {
      const used = []; let left = qty;
      for (const { lot, q } of lotsOf(itemId, loc)) { if (left <= 1e-9) break; const take = Math.min(q, left); move(itemId, -take, loc, "avail", ref, date, lot); used.push({ lot, qty: r2(take) }); left = r2(left - take); }
      if (left > 1e-9) move(itemId, -left, loc, "avail", ref, date, "");
      return used;
    }

    // ---------------------------------------------------------------- ledger
    function voucher(type, date, narration, lines, ref) {
      const dr = sum(lines, l => l.dr), cr = sum(lines, l => l.cr);
      if (Math.abs(dr - cr) > 0.005) throw new Invalid(`Unbalanced voucher ${narration}: ${dr} vs ${cr}`);
      const { id, no } = nextNo({ Sales: "SV", Purchase: "PV", Receipt: "RV", Payment: "PY", Journal: "JV", "Credit note": "CN" }[type] || "JV", date, 4);
      return put("vouchers", { id, no, type, date, narration, ref, lines: lines.filter(l => (l.dr || 0) + (l.cr || 0) > 0).map(l => ({ acct: l.acct, party: l.party || "", dr: r2(l.dr || 0), cr: r2(l.cr || 0) })) });
    }
    function trialBalance() {
      const t = {}; for (const v of Object.values(S.vouchers)) for (const l of v.lines) { t[l.acct] = t[l.acct] || { acct: l.acct, name: ACCT[l.acct] || l.acct, dr: 0, cr: 0 }; t[l.acct].dr = r2(t[l.acct].dr + l.dr); t[l.acct].cr = r2(t[l.acct].cr + l.cr); }
      const rows = Object.values(t).map(x => ({ ...x, bal: r2(x.dr - x.cr) })); return { rows, dr: sum(rows, x => x.dr), cr: sum(rows, x => x.cr) };
    }
    function partyBalance(pid) { let b = 0; for (const v of Object.values(S.vouchers)) for (const l of v.lines) if (l.party === pid && (l.acct === "DEBTORS" || l.acct === "CREDITORS" || l.acct === "ADV_CUST")) b += l.dr - l.cr; return r2(b); }
    function taxSplit(taxable, rate, p, zero) {
      if (zero) return { cgst: 0, sgst: 0, igst: 0 };
      const t = r2(taxable * rate / 100); if (intra(p)) { const h = r2(t / 2); return { cgst: h, sgst: r2(t - h), igst: 0 }; } return { cgst: 0, sgst: 0, igst: t };
    }

    // ---------------------------------------------------------------- costing
    function bomFor(itemId) { return Object.values(S.boms).find(b => b.item === itemId); }
    function stdCost(itemId) {
      const it = item(itemId); const b = bomFor(itemId);
      if (!b) return r2(it.cost || 0);
      const mat = sum(b.lines, l => l.qty * stdCost(l.item));
      return r2(mat + (b.labourHours || 0) * (S.meta.labourRate || 650) + (b.jobWork || 0) + (b.fat || 0) + (b.freight || 0));
    }
    function costBreak(itemId) {
      const b = bomFor(itemId); if (!b) return { bought: stdCost(itemId), steel: 0, labour: 0, other: 0 };
      let steel = 0, bought = 0; for (const l of b.lines) { const c = l.qty * stdCost(l.item); (item(l.item).group === "steel" ? (steel += c) : (bought += c)); }
      return { bought: r2(bought), steel: r2(steel), labour: r2((b.labourHours || 0) * (S.meta.labourRate || 650)), other: r2((b.jobWork || 0) + (b.fat || 0) + (b.freight || 0)) };
    }
    function priceQuote(q) {
      q.lines.forEach(l => { l.cost = r2(stdCost(l.item) * l.qty); l.amount = r2(l.qty * l.rate); });
      q.value = sum(q.lines, l => l.amount); q.cost = sum(q.lines, l => l.cost); q.margin = q.value ? r2((q.value - q.cost) / q.value * 100) : 0;
    }

    // ---------------------------------------------------------------- receivables & credit
    function invoiceDue(inv) { return addDays(inv.date, inv.creditDays || 0); }
    function overdue(pid) { return Object.values(S.invoices).filter(i => i.party === pid && i.state !== "paid" && daysBetween(invoiceDue(i), today()) > 0).map(i => ({ inv: i, days: daysBetween(invoiceDue(i), today()), due: r2(i.total - (i.paid || 0)) })); }

    // ================================================================ ACTIONS
    const A = {};

    // ---------------- CRM
    A.createOpp = (a, ctx) => {
      const p = party(a.party); const { id, no } = nextNo("OPP", a.date);
      const o = put("opps", { id, no, date: a.date || today(), party: p.id, title: a.title || "New enquiry", dealType: a.dealType || "fab", value: +a.value || 0, principal: a.principal || "", source: a.source || "", state: "new", owner: a.owner || "Sachin D." });
      log(o, "Opportunity created", ctx?.user); return o;
    };
    A.oppMove = (a, ctx) => {
      const o = need("opps", a.id); const to = a.to;
      if (to === "won") { const p = party(o.party); if (p.type === "customer" && !p.vendorCode) throw block("CRM.vendor-code", "Vendor code missing at customer", [p.name], "The customer must register STS as a vendor before a PO can be processed.", { label: "Mark vendor code received", action: "setVendorCode", args: { party: p.id } }, ctx); }
      o.state = to; if (to === "lost") o.lostReason = a.reason || ""; log(o, `Moved to ${to}${a.reason ? " · " + a.reason : ""}`, ctx?.user); touch("opps", o.id); return o;
    };
    A.setVendorCode = (a, ctx) => { const p = party(a.party); p.vendorCode = a.code || "Registered"; log(p, "Vendor code received", ctx?.user); touch("parties", p.id); return p; };

    // ---------------- Quotes
    A.createQuote = (a, ctx) => {
      const p = party(a.party); if (!a.lines || !a.lines.length) throw new Invalid("Add at least one line");
      const { id, no } = nextNo("QT", a.date);
      const q = { id, no, rev: 0, date: a.date || today(), party: p.id, opp: a.opp || "", dealType: a.dealType || (a.opp ? need("opps", a.opp).dealType : "fab"), validDays: +a.validDays || 30,
        terms: a.terms || "100% against delivery", advancePct: +a.advancePct || 0, lines: a.lines.map(l => ({ item: l.item, qty: +l.qty, rate: +l.rate, desc: item(l.item).name })), state: "draft", refs: [] };
      priceQuote(q); put("quotes", q);
      if (a.opp) { const o = need("opps", a.opp); link(q, "quotes", o, "opps"); if (o.state === "new") o.state = "qualified"; o.value = q.value; touch("opps", o.id); }
      log(q, `Quote created · margin ${q.margin}%`, ctx?.user); return q;
    };
    A.quoteSubmit = (a, ctx) => {
      const q = need("quotes", a.id); if (q.state !== "draft") throw new Invalid("Only a draft can be submitted"); priceQuote(q);
      if (q.margin < 15) { q.state = "pending"; log(q, `Needs director approval · margin ${q.margin}%`, ctx?.user, "warn"); touch("quotes", q.id);
        S.meta.blocks.unshift({ at: today(), rule: "QUO.margin-floor", title: `Margin ${q.margin}% below 15% floor`, chips: [q.no], why: "Sent for director approval", who: ctx?.role || "" }); return q; }
      q.state = "approved"; log(q, `Approved · margin ${q.margin}% above floor`, ctx?.user, "ok"); touch("quotes", q.id); return q;
    };
    A.quoteApprove = (a, ctx) => {
      const q = need("quotes", a.id); if (q.state !== "pending") throw new Invalid("Quote is not waiting for approval");
      if (!isDirector(ctx)) throw block("CST.approval", "Only a director can approve", [q.no, `margin ${q.margin}%`], "Below-floor margins need a director's decision.", null, ctx);
      q.state = "approved"; q.approvedBy = ctx.user || "Director"; q.approvalNote = a.note || ""; log(q, `Approved by ${q.approvedBy}${a.note ? " · " + a.note : ""}`, ctx.user, "ok"); touch("quotes", q.id); return q;
    };
    A.quoteSend = (a, ctx) => {
      const q = need("quotes", a.id); if (q.state !== "approved") throw new Invalid("Approve the quote first");
      q.state = "sent"; q.sentOn = a.date || today(); q.validTill = addDays(q.sentOn, q.validDays); log(q, `Sent · valid till ${q.validTill}`, ctx?.user); touch("quotes", q.id);
      if (q.opp) { const o = need("opps", q.opp); o.state = "offer"; touch("opps", o.id); } return q;
    };
    A.quoteRevise = (a, ctx) => {
      const q = need("quotes", a.id); if (!["sent", "approved", "pending", "draft"].includes(q.state)) throw new Invalid("This quote cannot be revised");
      const n = clone(q); n.id = q.id.replace(/-R\d+$/, "") + "-R" + (q.rev + 1); n.rev = q.rev + 1; n.no = q.no.replace(/ · R\d+$/, "") ; n.state = "draft"; n.date = today(); n.log = []; n.refs = [];
      if (a.lines) n.lines = a.lines.map(l => ({ item: l.item, qty: +l.qty, rate: +l.rate, desc: item(l.item).name }));
      delete n.sentOn; delete n.validTill; delete n.approvedBy; priceQuote(n); put("quotes", n);
      q.state = "revised"; q.supersededBy = n.id; touch("quotes", q.id); link(n, "quotes", q, "quotes"); if (q.opp) link(n, "quotes", need("opps", q.opp), "opps");
      log(n, `Revision R${n.rev} · re-costed, margin ${n.margin}%`, ctx?.user); log(q, `Superseded by R${n.rev}`, ctx?.user); return n;
    };
    A.quoteWin = (a, ctx) => {
      const q = need("quotes", a.id); if (q.state !== "sent") throw new Invalid("Only a sent quote can be won");
      if (today() > q.validTill) throw block("QUO.validity", "Quote validity has ended", [q.no + (q.rev ? " · R" + q.rev : ""), `valid till ${q.validTill}`], "Prices may have moved since the quote expired. Revise it to re-cost with today's rates.", { label: "Revise quote", action: "quoteRevise", args: { id: q.id } }, ctx);
      if (q.opp) A.oppMove({ id: q.opp, to: "won" }, ctx);
      q.state = "won"; log(q, "Won", ctx?.user, "ok"); touch("quotes", q.id); return q;
    };
    A.quoteLose = (a, ctx) => { const q = need("quotes", a.id); q.state = "lost"; q.lostReason = a.reason || ""; log(q, "Lost · " + (a.reason || ""), ctx?.user); touch("quotes", q.id); if (q.opp) { const o = need("opps", q.opp); o.state = "lost"; o.lostReason = a.reason || ""; touch("opps", o.id); } return q; };

    // ---------------- Customer PO
    A.createCPO = (a, ctx) => {
      const p = party(a.party); if (!a.custPo) throw new Invalid("Customer PO number is required"); if (!a.lines?.length) throw new Invalid("Add the PO lines");
      const id = "CPO-" + a.custPo.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
      if (get("cpos", id)) throw new Invalid("This customer PO is already entered");
      const q = a.quote ? need("quotes", a.quote) : null;
      const c = { id, no: a.custPo, date: a.date || today(), party: p.id, quote: q ? q.id : "", dealType: q ? q.dealType : (a.dealType || "fab"), shipTo: a.shipTo || p.city || "", shipToSEZ: !!a.shipToSEZ,
        advancePct: q ? q.advancePct : (+a.advancePct || 0), advanceDue: 0, advanceIn: 0, terms: q ? q.terms : (a.terms || ""), state: "received", refs: [],
        lines: a.lines.map((l, i) => ({ sr: l.sr || String(i + 1).padStart(2, "0"), custCode: l.custCode || "", item: l.item, qty: +l.qty, rate: +l.rate, delivered: 0, desc: l.desc || item(l.item).name, drawing: l.drawing || "" })) };
      c.value = sum(c.lines, l => l.qty * l.rate); c.advanceDue = r2(c.value * (1 + 0.18) * c.advancePct / 100);
      c.checks = cpoChecks(c); put("cpos", c); if (q) link(c, "cpos", q, "quotes");
      log(c, `Customer PO entered · ${c.lines.length} lines`, ctx?.user); return c;
    };
    function cpoChecks(c) {
      const q = c.quote ? get("quotes", c.quote) : null; const out = [];
      if (q) { const bad = c.lines.filter(l => { const ql = q.lines.find(x => x.item === l.item); return !ql || Math.abs(ql.rate - l.rate) > 0.005 || l.qty > ql.qty; });
        out.push({ key: "rate", ok: !bad.length, label: bad.length ? `${bad.length} line(s) differ from quote` : "Rates match quote" }); }
      else out.push({ key: "rate", ok: true, label: "No quote to compare", soft: true });
      const coded = c.lines.filter(l => l.custCode).length; out.push({ key: "codes", ok: true, label: `${coded}/${c.lines.length} lines carry customer codes`, soft: true });
      if (c.shipToSEZ) out.push({ key: "sez", ok: true, label: party(c.party).sez ? "SEZ recipient · zero-rated" : "SEZ ship-to, DTA buyer · domestic GST", soft: true, warn: !party(c.party).sez });
      return out;
    }
    A.cpoAccept = (a, ctx) => {
      const c = need("cpos", a.id); if (!["received", "deviation"].includes(c.state)) throw new Invalid("Already accepted");
      const p = party(c.party); if (p.type === "customer" && !p.vendorCode) throw block("CRM.vendor-code", "Vendor code missing at customer", [p.name], "The customer must register STS as a vendor first.", { label: "Mark vendor code received", action: "setVendorCode", args: { party: p.id } }, ctx);
      c.checks = cpoChecks(c); const rate = c.checks.find(x => x.key === "rate");
      if (!rate.ok && !a.acceptDeviation) { c.state = "deviation"; touch("cpos", c.id); throw block("CPO.rate-match", "PO differs from the quote", [rate.label, c.no], "Rates or quantities on the customer's PO don't match the quote. Ask for an amended PO, or accept the deviation as a director.", isDirector(ctx) ? { label: "Accept deviation", action: "cpoAccept", args: { id: c.id, acceptDeviation: true } } : null, ctx); }
      if (!rate.ok && a.acceptDeviation && !isDirector(ctx)) throw block("CST.approval", "Only a director can accept a deviation", [c.no], "", null, ctx);
      c.state = c.advancePct > 0 && c.advanceIn < c.advanceDue ? "advance" : "accepted"; c.acceptedOn = today();
      // plan execution: fabricated lines → jobs
      for (const [i, l] of c.lines.entries()) {
        const it = item(l.item);
        if (it.make && !l.job) { const j = A.createJob({ item: l.item, qty: l.qty, cpo: c.id, line: i }, ctx); l.job = j.id; }
      }
      if (c.quote) { const q = get("quotes", c.quote); if (q && q.state === "sent") { q.state = "won"; touch("quotes", q.id); if (q.opp) { const o = get("opps", q.opp); if (o) { o.state = "won"; touch("opps", o.id); } } } }
      log(c, c.state === "advance" ? `Accepted · advance ₹${c.advanceDue.toLocaleString("en-IN")} due (proforma)` : "Accepted · in execution", ctx?.user, "ok"); touch("cpos", c.id); return c;
    };
    A.cpoAdvance = (a, ctx) => {
      const c = need("cpos", a.id); const amt = r2(+a.amount); if (!(amt > 0)) throw new Invalid("Enter the amount received");
      c.advanceIn = r2(c.advanceIn + amt);
      const v = voucher("Receipt", a.date || today(), `Advance from ${party(c.party).name} against ${c.no} (no GST on goods advance)`, [{ acct: "BANK", dr: amt }, { acct: "ADV_CUST", party: c.party, cr: amt }], c.id);
      const pay = put("payments", { id: v.id, no: v.no, date: v.date, party: c.party, kind: "advance", amount: amt, ref: c.id, refs: [] }); link(pay, "payments", c, "cpos");
      if (c.state === "advance" && c.advanceIn >= c.advanceDue - 0.5) c.state = "accepted";
      log(c, `Advance received ₹${amt.toLocaleString("en-IN")} · receipt voucher ${v.no}`, ctx?.user, "ok"); touch("cpos", c.id); return c;
    };

    // ---------------- Purchase
    A.createPO = (a, ctx) => {
      const sup = party(a.supplier); if (!a.lines?.length) throw new Invalid("Add at least one line");
      const { id, no } = nextNo("PO", a.date);
      const po = { id, no, date: a.date || today(), supplier: sup.id, shipTo: a.shipTo || "PUN", lines: a.lines.map(l => ({ item: l.item, qty: +l.qty, rate: +l.rate, received: 0, desc: item(l.item).name })), state: "draft", reason: a.reason || "", refs: [], quoteRef: a.quoteRef || "" };
      po.value = sum(po.lines, l => l.qty * l.rate); const tx = taxSplit(po.value, 18, sup); po.total = r2(po.value + tx.cgst + tx.sgst + tx.igst);
      put("pos", po); if (a.job) { const j = need("jobs", a.job); link(po, "pos", j, "jobs"); }
      log(po, "PO drafted" + (a.reason ? " · " + a.reason : ""), ctx?.user); return po;
    };
    A.poApprove = (a, ctx) => {
      const po = need("pos", a.id); if (!["draft", "pending"].includes(po.state)) throw new Invalid("Already approved");
      if (po.value > 25000 && !isDirector(ctx)) { po.state = "pending"; touch("pos", po.id); throw block("PUR.approval", "PO above ₹25,000 needs a director", [po.no, "₹" + po.value.toLocaleString("en-IN")], "Purchases above ₹25,000 need director approval. Switch to the Director role or send it for approval.", null, ctx); }
      po.state = "approved"; po.approvedBy = ctx?.user || ""; log(po, "Approved", ctx?.user, "ok"); touch("pos", po.id); return po;
    };
    A.poSend = (a, ctx) => { const po = need("pos", a.id); if (po.state !== "approved") throw new Invalid("Approve the PO first"); po.state = "sent"; po.sentOn = a.date || today(); log(po, "Sent to supplier", ctx?.user); touch("pos", po.id); return po; };
    A.receive = (a, ctx) => {
      const po = need("pos", a.po); if (!["sent", "partial"].includes(po.state)) throw new Invalid("Send the PO before receiving");
      const { id, no } = nextNo("GRN", a.date);
      const loc = a.loc || po.shipTo || "PUN";
      const g = { id, no, date: a.date || today(), po: po.id, supplier: po.supplier, loc, state: "qc", refs: [], lines: [] };
      for (const l of a.lines) {
        const pl = po.lines.find(x => x.item === l.item); if (!pl) throw new Invalid(`${l.item} is not on ${po.no}`);
        const qty = +l.qty; if (!(qty > 0)) continue; if (pl.received + qty > pl.qty + 1e-9) throw new Invalid(`Receiving more than ordered for ${item(l.item).name}`);
        pl.received = r2(pl.received + qty);
        const lot = l.heat || l.lot || (no + "-" + (g.lines.length + 1));
        g.lines.push({ item: l.item, qty, rate: pl.rate, cert: !!l.cert, certRef: l.certRef || "", mtcGrade: l.mtcGrade || "", lot, status: "qc" });
        move(l.item, qty, loc, "qc", g.id, g.date, lot);
      }
      if (!g.lines.length) throw new Invalid("Enter a quantity to receive");

        const ch = changes(existing, data, ["name", "gstin", "city", "address", "contact", "phone", "email", "creditDays", "vendorCode", "msme", "writtenTerms"], { name: "Name", gstin: "GSTIN", city: "City", address: "Address", contact: "Contact", phone: "Phone", email: "Email", creditDays: "Credit days", vendorCode: "Vendor code", msme: "MSME", writtenTerms: "Written terms" });
        const stateChanged = existing.state !== data.state; Object.assign(existing, data); if (ch.length) log(existing, "Edited · " + ch.join(" · ") + (stateChanged ? ` · now ${data.state === "MH" ? "CGST + SGST" : "IGST"} on new documents` : ""), ctx?.user); touch("parties", existing.id); return existing;
      }
      const id = (type === "supplier" ? "S-" : type === "jobworker" ? "J-" : "C-") + name.replace(/[^A-Za-z0-9]/g, "").slice(0, 8).toUpperCase() + "-" + (S.meta.pseq = (S.meta.pseq || 0) + 1); touch("meta", "main");
      const p = put("parties", { id, ...data, refs: [], log: [] }); log(p, "Added", ctx?.user, "ok"); return p;
    };
    A.archiveParty = (a, ctx) => {
      const p = party(a.id); const why = []; const b = partyBalance(p.id); if (Math.abs(b) > 0.5) why.push(`${fmtR(Math.abs(b))} ${b > 0 ? "still to collect" : "still to pay"}`);
      const open = [["quotes", ["draft", "pending", "approved", "sent"]], ["cpos", ["received", "deviation", "advance", "accepted"]], ["pos", ["draft", "pending", "approved", "sent", "partial"]], ["opps", ["new", "qualified", "offer"]]];
      open.forEach(([c, st]) => Object.values(S[c]).forEach(x => { if ((x.party === p.id || x.supplier === p.id) && st.includes(x.state)) why.push(`open ${x.no}`); }));
      if (why.length) throw new Invalid(`Can't retire ${p.name}: ${why.slice(0, 4).join(", ")}.`);
      p.archived = true; log(p, "Retired · hidden from pickers", ctx?.user); touch("parties", p.id); return p;
    };
    A.restoreParty = (a, ctx) => { const p = party(a.id); p.archived = false; log(p, "Brought back", ctx?.user, "ok"); touch("parties", p.id); return p; };

    // ---------------- CRM follow-ups
    A.logFollowUp = (a, ctx) => {
      const o = need("opps", a.id); if (["won", "lost"].includes(o.state)) throw new Invalid("This enquiry is closed");

      o.followUp = a.next || ""; o.lastContact = today(); log(o, `${a.how || "Call"}: ${note}${a.next ? ` · next on ${a.next}` : ""}`, ctx?.user); touch("opps", o.id); return o;
    };

    // ---------------- Purchase orders: cancel, close the balance
    A.poCancel = (a, ctx) => {

      if (!(a.reason || "").trim()) throw new Invalid("Say why it's cancelled");
      po.state = "cancelled"; po.closedReason = a.reason; log(po, "Cancelled · " + a.reason, ctx?.user, "bad"); touch("pos", po.id); return po;
    };
    A.poClose = (a, ctx) => {
      const po = need("pos", a.id); if (po.state !== "partial") throw new Invalid("Close the balance only after part of the order has arrived");
      if (!(a.reason || "").trim()) throw new Invalid("Say why the rest won't come");
      const bal = po.lines.filter(l => l.received < l.qty).map(l => `${item(l.item).name} ${r2(l.qty - l.received)} ${item(l.item).uom}`);
      po.state = "closed"; po.closedReason = a.reason; log(po, `Balance closed (${bal.join(", ")}) · ${a.reason}`, ctx?.user, "warn"); touch("pos", po.id); return po;
    };

    // ---------------- BOMs: create, revise
    const nextRev = r => { if (!r) return "A"; const c = String(r).toUpperCase(); return /^[A-Y]$/.test(c) ? String.fromCharCode(c.charCodeAt(0) + 1) : c + "1"; };
    A.saveBOM = (a, ctx) => {
      const it = item(a.item); if (it.type !== "FG") throw new Invalid(`${it.name} isn't a product we make. Only made products have a BOM.`);

      for (const l of lines) { const m = item(l.item); if (l.item === it.id) throw new Invalid("A product can't be one of its own materials"); if (!(l.qty > 0)) throw new Invalid(`Enter a quantity for ${m.name}`); if (m.type === "SERVICE") throw new Invalid(`${m.name} is a service, not a material. Put it under job work or testing.`); }
      const seen = new Set(); for (const l of lines) { if (seen.has(l.item)) throw new Invalid(`${item(l.item).name} is listed twice`); seen.add(l.item); }
      const hours = +a.labourHours || 0; if (hours < 0) throw new Invalid("Labour hours can't be negative");
      const data = { lines, labourHours: hours, jobWork: +a.jobWork || 0, fat: +a.fat || 0, freight: +a.freight || 0, drawingRev: (a.drawingRev || "").trim() || "—", needsDrawing: !!a.needsDrawing };
      const b = bomFor(it.id);
      if (!b) { const id = "BOM-" + it.id; const nb = put("boms", { id, item: it.id, rev: "A", ...data, drawingApproved: !data.needsDrawing, history: [], refs: [], log: [] }); log(nb, "BOM created · rev A", ctx?.user, "ok"); log(it, "BOM created · cost " + fmtR(stdCost(it.id)), ctx?.user); touch("items", it.id); return nb; }
      const before = stdCost(it.id); const oldRev = b.rev;
      b.history = b.history || []; b.history.unshift({ rev: b.rev, at: today(), lines: clone(b.lines), labourHours: b.labourHours, drawingRev: b.drawingRev });
      const drawingChanged = data.drawingRev !== b.drawingRev; Object.assign(b, data); b.rev = nextRev(b.rev);
      if (data.needsDrawing && (drawingChanged || !b.drawingApproved)) b.drawingApproved = false; if (!data.needsDrawing) b.drawingApproved = true;
      const after = stdCost(it.id); const keep = Object.values(S.jobs).filter(j => j.bom === b.id && ["released", "wip", "qc"].includes(j.state)).map(j => j.no);
      log(b, `Revised ${oldRev} → ${b.rev} · cost ${fmtR(before)} → ${fmtR(after)}${drawingChanged && data.needsDrawing ? " · new drawing needs customer approval" : ""}${keep.length ? " · " + keep.join(", ") + " keep rev " + oldRev : ""}`, ctx?.user, "ok");
      log(it, `BOM rev ${b.rev} · cost ${fmtR(before)} → ${fmtR(after)}`, ctx?.user); touch("boms", b.id); touch("items", it.id); return b;
    };

    // ---------------- Jobs: make for stock, cancel
    A.makeForStock = (a, ctx) => {
      const it = item(a.item); if (it.type !== "FG") throw new Invalid("Only a product we make can have a job");
      if (!bomFor(it.id)) throw new Invalid(`${it.name} has no BOM yet. Create the BOM first, so the job knows what material to use.`);
      if (!(+a.qty > 0)) throw new Invalid("Enter how many to make");
      const j = A.createJob({ item: it.id, qty: +a.qty }, ctx); j.reason = a.reason || "For stock"; log(j, "For stock · " + j.reason, ctx?.user); return j;
    };
    A.jobCancel = (a, ctx) => {
      const j = need("jobs", a.id); if (!["planned", "released"].includes(j.state)) throw new Invalid("Material has been issued. A job in progress can't be cancelled; finish it or scrap it.");
      if (!(a.reason || "").trim()) throw new Invalid("Say why it's cancelled");
      j.state = "cancelled"; j.cancelReason = a.reason; if (j.cpo) { const c = get("cpos", j.cpo); if (c && c.lines[j.line]) { c.lines[j.line].job = ""; touch("cpos", c.id); log(c, `Job ${j.no} cancelled · ${a.reason}`, ctx?.user, "warn"); } }
      log(j, "Cancelled · " + a.reason, ctx?.user, "bad"); touch("jobs", j.id); return j;
    };

    // ---------------- Gauges & welders
    A.saveInstrument = (a, ctx) => {
      const id = (a.id || "").trim().toUpperCase(); if (!id) throw new Invalid("Enter the gauge tag, like DP-04");
      if (a.isNew && get("instruments", id)) throw new Invalid(`Tag ${id} is already used`);
      if (!(a.name || "").trim()) throw new Invalid("Say what the gauge is");
      if (!a.calUntil) throw new Invalid("Enter when its calibration runs out");
      const r = Object.assign(get("instruments", id) || { id, log: [] }, { name: a.name.trim(), range: (a.range || "").trim(), calUntil: a.calUntil, lab: (a.lab || "").trim() });
      put("instruments", r); log(r, a.isNew ? "Added" : "Edited", ctx?.user); return r;
    };
    A.calibrate = (a, ctx) => {
      const ins = need("instruments", a.id); const done = a.doneOn || today();
      if (done > today()) throw new Invalid("The calibration date can't be in the future");
      if (a.result !== "fail") { if (!a.until || a.until <= done) throw new Invalid("Valid until must be after the date it was calibrated"); if (!(a.certNo || "").trim()) throw new Invalid("Enter the calibration certificate number"); }
      if (a.result === "fail") { ins.outOfService = true; log(ins, `Failed calibration on ${done}${a.certNo ? " · " + a.certNo : ""} · out of use`, ctx?.user, "bad"); }
      else { ins.outOfService = false; ins.calUntil = a.until; ins.lastCal = done; ins.certNo = a.certNo.trim(); if (a.lab) ins.lab = a.lab; log(ins, `Calibrated ${done} · valid till ${a.until} · cert ${ins.certNo}`, ctx?.user, "ok"); }
      touch("instruments", ins.id); return ins;
    };
    A.saveWelder = (a, ctx) => {
      if (!(a.name || "").trim()) throw new Invalid("Enter the welder's name"); if (!a.wpqUntil) throw new Invalid("Enter until when they're qualified");
      let id = a.id; if (!id) { let n = Object.keys(S.welders).length + 1; while (get("welders", "W" + n)) n++; id = "W" + n; }
      const w = Object.assign(get("welders", id) || { id, log: [] }, { name: a.name.trim(), process: (a.process || "TIG, SS").trim(), wpqUntil: a.wpqUntil, certNo: (a.certNo || "").trim() });
      put("welders", w); log(w, a.id ? "Edited" : "Added", ctx?.user); return w;
    };
    A.requalify = (a, ctx) => {
      const w = need("welders", a.id); if (!a.until || a.until <= today()) throw new Invalid("The new qualification must run past today");
      if (!(a.certNo || "").trim()) throw new Invalid("Enter the WPQ certificate number");
      w.wpqUntil = a.until; w.certNo = a.certNo.trim(); if (a.process) w.process = a.process; log(w, `Requalified till ${a.until} · ${w.certNo}`, ctx?.user, "ok"); touch("welders", w.id); return w;
    };

    // ---------------- Installed equipment supplied before the ERP
    A.addAsset = (a, ctx) => {
      const p = party(a.party); if (p.type !== "customer") throw new Invalid("Pick the customer it's installed at");
      if (!(a.label || "").trim()) throw new Invalid("Say what the equipment is");
      if (!a.installedOn) throw new Invalid("Enter when it was installed"); if (a.installedOn > today()) throw new Invalid("Installation date can't be in the future");
      if (a.warrantyUntil && a.warrantyUntil < a.installedOn) throw new Invalid("Warranty can't end before it was installed");
      const serial = (a.serial || "").trim().toUpperCase(); if (serial && get("assets", serial)) throw new Invalid(`Serial ${serial} is already registered`);
      const id = serial || "AS-" + (S.meta.aseq = (S.meta.aseq || 0) + 1); touch("meta", "main");
      const as = A.registerAsset({ id, item: a.item || null, party: p.id, site: a.site || p.city, installedOn: a.installedOn, warrantyUntil: a.warrantyUntil || "", custPo: a.custPo || "", note: a.note || "Supplied before the ERP" });
      as.label = a.label.trim(); as.log = []; log(as, "Registered", ctx?.user, "ok"); link(as, "assets", p, "parties"); return as;
    };

    // ---------------- Expenses
    const EXP = { EXP_RENT: "Rent", EXP_POWER: "Power & fuel", EXP_SALARY: "Salaries & wages", EXP_TRAVEL: "Travel & conveyance", EXP_FREIGHT: "Freight & transport", EXP_OFFICE: "Office & other expenses" };
    A.recordExpense = (a, ctx) => {
      if (!EXP[a.head]) throw new Invalid("Pick what the expense is for");
      const amt = r2(+a.amount); if (!(amt > 0)) throw new Invalid("Enter the amount before GST");
      const rate = a.gstRate === undefined || a.gstRate === "" ? 0 : +a.gstRate; if (![0, 5, 12, 18, 28].includes(rate)) throw new Invalid("GST rate must be 0, 5, 12, 18 or 28%");
      if (rate && !a.registered) throw new Invalid("Only a GST-registered supplier's bill gives input GST. Set GST to 0% or tick 'Supplier is GST-registered'.");
      const date = a.date || today(); if (date > today()) throw new Invalid("The date can't be in the future");
      const total = r2(amt * (1 + rate / 100));
      if (total > 25000 && !isDirector(ctx)) throw block("CST.expense", "Expense above ₹25,000 needs a director", [fmtR(total), EXP[a.head]], "Big payments out of the bank need a director's approval, the same limit as purchases.", null, ctx);
      const g = r2(amt * rate / 200); const { id, no } = nextNo("EXP", date);
      const v = voucher("Payment", date, `${EXP[a.head]} · ${a.paidTo || ""}${a.note ? " · " + a.note : ""}`, [{ acct: a.head, dr: amt }, { acct: "IN_CGST", dr: g }, { acct: "IN_SGST", dr: r2(total - amt - g) }, { acct: "BANK", cr: total }], id);
      const e = put("expenses", { id, no, date, head: a.head, paidTo: (a.paidTo || "").trim(), amount: amt, gstRate: rate, total, voucher: v.id, note: a.note || "", refs: [], log: [] });

    };

    // ---------------- Demo controls
    A.advanceDays = (a) => { S.meta.today = addDays(S.meta.today, +a.days || 1); touch("meta", "main"); return S.meta.today; };
    A.createParty = (a, ctx) => {
      if (!a.name || !a.name.trim()) throw new Invalid("Enter the name");
      const id = (a.type === "supplier" ? "S-" : "C-") + a.name.replace(/[^A-Za-z0-9]/g, "").slice(0, 8).toUpperCase() + "-" + (S.meta.pseq = (S.meta.pseq || 0) + 1); touch("meta", "main");
      const p = put("parties", { id, name: a.name.trim(), type: a.type || "customer", gstin: (a.gstin || "").toUpperCase(), state: (a.state || "MH").toUpperCase(), city: a.city || "", creditDays: +a.creditDays || 0,
        vendorCode: a.vendorCode ? "Registered" : "", msme: !!a.msme, refs: [], log: [] }); log(p, "Added", ctx?.user); return p;
    };
    A.setItemHSN = (a, ctx) => { const it = item(a.item); it.hsn = a.hsn; log(it, "HSN set to " + a.hsn, ctx?.user); touch("items", it.id); return it; };

    // ================================================================ READ MODELS
    function stateOf(c, r) { return (LIFE[c] || []).find(s => s[0] === r.state) || [r.state, r.state]; }
    function nextActions(c, r, ctx) {
      const L = [];
      const add = (action, label, primary, args, input) => L.push({ action, label, primary: !!primary, args: Object.assign({ id: r.id }, args || {}), input });
      if (c === "opps") { if (r.state === "new") add("oppMove", "Qualify", true, { to: "qualified" }); if (["new", "qualified", "offer"].includes(r.state)) { add("newQuote", "Create quote", r.state !== "new"); add("oppMove", "Mark lost", false, { to: "lost" }, "reason"); } }
      if (c === "quotes") { if (r.state === "draft") add("quoteSubmit", "Submit", true); if (r.state === "pending") add("quoteApprove", "Approve", true, {}, "note"); if (r.state === "approved") add("quoteSend", "Send quote", true);
        if (r.state === "sent") { add("quoteWin", "Mark won", true); add("newCPO", "Enter customer PO"); add("quoteLose", "Mark lost", false, {}, "reason"); }
        if (["draft", "pending", "approved", "sent"].includes(r.state)) add("quoteRevise", "Revise"); }
      if (c === "cpos") { if (["received", "deviation"].includes(r.state)) add("cpoAccept", "Accept PO", true); if (r.state === "advance" || (r.advancePct > 0 && r.advanceIn < r.advanceDue - 0.5 && r.state !== "received")) add("cpoAdvance", "Record advance", r.state === "advance", {}, "amount");
        if (r.state === "accepted" && r.lines.some(l => l.delivered < l.qty)) add("newDispatch", "Create dispatch", true); }
      if (c === "pos") { if (["draft", "pending"].includes(r.state)) add("poApprove", "Approve", true); if (r.state === "approved") add("poSend", "Send to supplier", true); if (["sent", "partial"].includes(r.state)) add("newReceipt", "Receive goods", true); }
      if (c === "grns") { if (!r.bill && r.lines.some(l => l.status === "accepted") && r.state === "done") add("createBill", "Book supplier bill", true, { grn: r.id }, "billNo"); }
      if (c === "bills") { if (r.state !== "paid") add("payBill", "Pay", true); }
      if (c === "jobs") { if (r.state === "planned") { add("jobRelease", "Release", true); if (shortages(r).length) add("poForShortages", "PO for shortages", false, { job: r.id }); }
        if (r.state === "released") add("jobStart", "Start", true, {}, item(r.item).weld ? "welder" : null); if (r.state === "wip") add("jobFinish", "Finish work", true, {}, "hours"); if (r.state === "qc") add("jobQC", "Final QC", true, {}, "instrument"); }
      if (c === "dispatches") { if (r.state === "draft") add("issueDispatch", r.docType === "invoice" ? "Issue invoice" : "Issue challan", true); if (r.state === "issued") add("deliver", "Record delivery", true, {}, "by"); }
      if (c === "invoices") { if (r.state !== "paid") { add("receivePayment", r.kind === "commission" ? "Record FIRC receipt" : "Record payment", true, { invoice: r.id }, "amount"); } if (r.kind !== "commission") add("creditNote", "Credit note", false, { invoice: r.id }, "cn"); }
      if (c === "cpos" && r.dealType === "indent" && r.state !== "received") add("newCommission", "Bill commission", false, { cpo: r.id });
      if (c === "challans") { if (r.kind === "jobwork" && r.state === "open") add("jobWorkIn", "Receive back", true, {}, "charge"); }
      if (c === "calls") { if (r.state === "open") add("resolveCall", "Resolve", true, {}, "parts"); }
      if (c === "assets") { add("newCall", "Log service call", true, { asset: r.id }); add("setAmc", "Set AMC", false, { asset: r.id }, "amc"); }
      if (c === "boms") { if (r.needsDrawing && !r.drawingApproved) add("approveDrawing", "GA approved by customer", true); }
      if (c === "opps" && !["won", "lost"].includes(r.state)) add("logFollowUp", "Log follow-up", !!(r.followUp && r.followUp <= today()), {}, "followup");
      if (c === "pos") { if (["draft", "pending", "approved", "sent"].includes(r.state) && !r.lines.some(l => l.received > 0)) add("poCancel", "Cancel PO", false, {}, "cancel"); if (r.state === "partial") add("poClose", "Close the balance", false, {}, "closebal"); }

        const bm = belowMin().find(x => x.item === r.id); if (bm && r.supplier) add("newPO", "Order more", true, { item: r.id, qty: bm.suggest, supplier: r.supplier });
        add("editItem", "Edit details", !bm); if (r.type !== "SERVICE") add("newCount", "Count stock", false, { item: r.id }); if (r.type === "FG") add("editBOM", bomFor(r.id) ? "Revise BOM" : "Create BOM", false, { item: r.id }); add("archiveItem", "Retire item"); } }
      if (c === "parties") { if (r.archived) add("restoreParty", "Bring back", true); else { add("editParty", "Edit details", true); add("archiveParty", "Retire"); } }
      return L;
    }

    function clocks() {
      const t = today(), out = []; const add = (what, due, rule, c, id, kind, period) => out.push({ what, due, rule, c, id, kind, left: daysBetween(t, due), period: period || 30 });
      Object.values(S.quotes).filter(q => q.state === "sent").forEach(q => add(`Quote ${q.no}${q.rev ? " R" + q.rev : ""} validity`, q.validTill, "Re-cost after expiry", "quotes", q.id, "deal", q.validDays));
      Object.values(S.bills).filter(b => b.state !== "paid" && b.msme).forEach(b => add(`MSME bill · ${party(b.supplier).name}`, b.dueDate, "§43B(h) · pay in time", "bills", b.id, "money", 15));
      Object.values(S.bills).filter(b => b.state !== "paid" && !b.msme).forEach(b => add(`Supplier bill · ${party(b.supplier).name}`, b.dueDate, "Credit terms", "bills", b.id, "money", 30));
      Object.values(S.invoices).filter(i => i.state !== "paid").forEach(i => { const d = invoiceDue(i); if (daysBetween(t, d) <= 15) add(`Receivable · ${party(i.party).name}`, d, "Customer credit terms", "invoices", i.id, "money", Math.max(i.creditDays, 15)); });
      Object.values(S.challans).filter(c => c.kind === "jobwork" && c.state === "open").forEach(c => add(`Job work · ${party(c.jobworker).name}`, addDays(c.date, 365), "Return within 1 year (§143)", "challans", c.id, "supply", 365));
      Object.values(S.cpos).filter(c => c.state === "advance").forEach(c => add(`Advance · ${party(c.party).name}`, addDays(c.acceptedOn || c.date, 7), "Before job release", "cpos", c.id, "deal", 7));
      Object.values(S.instruments).forEach(i => { if (daysBetween(t, i.calUntil) <= 60) add(`Calibration · ${i.id} ${i.name}`, i.calUntil, "No inspection after due date", "instruments", i.id, "works", 365); });
      Object.values(S.welders).forEach(w => { if (daysBetween(t, w.wpqUntil) <= 60) add(`WPQ · ${w.name}`, w.wpqUntil, "Requalify welder", "welders", w.id, "works", 365); });
      Object.values(S.assets).forEach(a => { if (a.warrantyUntil && daysBetween(t, a.warrantyUntil) <= 90 && daysBetween(t, a.warrantyUntil) > -30) add(`Warranty ends · ${party(a.party).name}`, a.warrantyUntil, "Offer AMC", "assets", a.id, "service", 365);
        if (a.amcUntil && daysBetween(t, a.amcUntil) <= 60) add(`AMC renewal · ${party(a.party).name}`, a.amcUntil, "Renew AMC", "assets", a.id, "service", 365); });
      (S.meta.compliance || []).forEach(c => add(c.what, c.due, c.rule, "", "", "compliance", c.period || 90));
      return out.sort((a, b) => a.left - b.left);
    }

    function queues(role) {
      const Q = []; const q = (key, label, icon, tone, recs, c) => { if (recs.length || key === "nohsn") Q.push({ key, label, icon, tone, n: recs.length, c, ids: recs.map(r => r.id) }); };
      const V = c => Object.values(S[c]);
      const all = {
        approveQuotes: () => q("approveQuotes", "Quotes to approve", "stamp", "warn", V("quotes").filter(x => x.state === "pending"), "quotes"),

    const nw = t.closest("[data-new]"); if (nw) { NEW[nw.dataset.new](nw.dataset.arg ? JSON.parse(nw.dataset.arg) : undefined); return; }
    const op = t.closest("[data-open]"); if (op) { const [c, id] = op.dataset.open.split("|"); if (E.S[c] && E.S[c][id]) open(c, id); return; }
    const mm = t.closest("[data-m]"); if (mm) { go(mm.dataset.m, mm.dataset.tab); return; }
    if (t.closest("[data-back]")) { rec = stack.pop() || null; render(); return; }
    const fl = t.closest("[data-filt]"); if (fl) { const [c, s] = fl.dataset.filt.split("|"); filt[c] = s; render(); return; }
    const ins = t.closest("[data-inspect]"); if (ins) { const [line, result] = ins.dataset.inspect.split("|"); if (result === "accept") form("Inspect and accept", [{ k: "instrument", label: "Gauge used (if any)", type: "select", key: "instrument", options: [["", "Visual check only", "no gauge needed"], ...instOpts()], value: "" }], v => act("inspect", { grn: rec.id, line: +line, result, instrument: v.instrument || undefined }, "Accepted into stock"), { kicker: "Quality · incoming", submit: "Accept" });
      else form("Reject this lot", [{ k: "note", label: "Why", value: "Not as per PO", wide: true }], v => act("inspect", { grn: rec.id, line: +line, result, note: v.note }, "Rejected"), { kicker: "Quality · incoming", submit: "Reject" }); return; }
    const dt = t.closest("[data-doctype]"); if (dt) { act("dispatchSet", { id: rec.id, docType: dt.dataset.doctype }, "Document changed"); return; }
    if (t.closest("[data-ewbset]")) { act("dispatchSet", { id: rec.id, ewb: $("#ewb").value.trim() }, "E-way bill saved"); return; }
    const sh = t.closest("[data-sethsn]"); if (sh) { act("setItemHSN", { item: sh.dataset.sethsn, hsn: $("#hsnin").value.trim() }, "HSN saved"); return; }
    if (t.closest("[data-doc]")) return docPreview();
    if (t.closest("[data-settings]")) return settings();
    if (t.closest("[data-help]")) return help();
    if (t.closest("[data-menu]")) { sheet(`<div class="sts-stack"><div class="sts-rec-title" style="font-size:20px">All modules</div><div class="x-map is-list"><a href="#" data-m="home" class="x-map-m">${I("house")}<span>Home</span></a>${GROUPS.map(([g, ms]) => `<div class="sts-label" style="margin-top:6px">${g}</div>${ms.map(m => `<a href="#" data-m="${m}" class="x-map-m">${I(MOD[m].ic)}<span>${MOD[m].name}</span></a>`).join("")}`).join("")}</div><button class="sts-btn" data-settings="1">${I("settings")}Settings</button></div>`); return; }
    if (t.closest("[data-hidebanner]")) { prefs.hideBanner = true; savePrefs(); render(); return; }
    const adv = t.closest("[data-adv]"); if (adv) { act("advanceDays", { days: +adv.dataset.adv }, `Moved to ${fmtD(H.addDays(T(), +adv.dataset.adv))}`); settings(); return; }
    if (t.closest("[data-export]")) return exportData();
    if (t.closest("[data-reset]")) { sheet(`<div class="sts-stack"><div class="sts-rec-title">Start again?</div><div class="sts-muted">Everything you did in this browser is replaced by the original demo data. Export first if you want to keep it.</div><div class="sts-row" style="justify-content:flex-end"><button class="sts-btn" data-close="1">Cancel</button><button class="sts-btn sts-btn-danger" data-reset-yes="1">Start again</button></div></div>`); return; }
    if (t.closest("[data-reset-yes]")) { E = STSEngine.createEngine(clone(SEED)); undoState = null; save(); closeSheet(); rec = null; stack.length = 0; toast("Fresh start", "ok"); render(); return; }
    const th = t.closest("[data-theme-set]"); if (th) { prefs.theme = th.dataset.themeSet; savePrefs(); const inSettings = !!$("#sheet-body [data-sheet=settings]"); render(); if (inSettings) settings(); return; }
    const rs = t.closest("[data-role-set]"); if (rs) { prefs.role = rs.dataset.roleSet; savePrefs(); render(); settings(); toast("Working as " + me()[1], "ok"); return; }
    const pi = t.closest("#palopts .sts-cmd-o"); if (pi) { closePal(); pal.list[+pi.dataset.i][2](); return; }
    if (t.id === "pal") return closePal();
    const qr = t.closest("[data-qhit]"); if (qr) { const [c, id] = qr.dataset.qhit.split("|"); $("#qres").hidden = true; open(c, id); return; }
    if (t.closest("[data-close]")) return requestClose();
    if (t.id === "sheet") return requestClose();
    if (!t.closest(".x-search")) { const q = $("#qres"); if (q) q.hidden = true; }
  });
  document.addEventListener("change", e => {
    const dn = e.target.closest("[data-done]"); if (dn) { prefs.done = prefs.done || {}; prefs.done[dn.dataset.done] = dn.checked; savePrefs(); help(); }
    if (e.target.dataset.gst) { gstMonth = e.target.value; render(); }
    if (e.target.id === "importf") { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const st = JSON.parse(rd.result); if (!st.meta || !st.meta.demo) throw new Error("not an STS ERP demo export"); E = STSEngine.createEngine(st); save(); rec = null; closeSheet(); toast("Data imported", "ok"); render(); } catch (err) { toast("Couldn't import: " + err.message, "bad"); } }; rd.readAsText(f); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q") { const hits = E.search(e.target.value).slice(0, 8); const box = $("#qres"); if (!e.target.value.trim()) { box.hidden = true; return; }
      box.innerHTML = hits.length ? hits.map(h => `<a href="#" data-qhit="${h.c}|${h.id}"><span class="sts-ichip">${I(CIC[h.c] || "file")}</span><span><b>${esc(num(h.c, h.r))}</b><span class="sts-label">${esc(NAME[h.c] || h.c)} · ${esc(title(h.c, h.r))}</span></span></a>`).join("") : `<div class="sts-label" style="padding:12px">Nothing found for “${esc(e.target.value)}”</div>`; box.hidden = false; icons(); }
    if (e.target.id === "palq") filterPal(e.target.value);
    const ls = e.target.dataset && e.target.dataset.lsearch; if (ls) { q2[ls] = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector(`[data-lsearch="${ls}"]`); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPal(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !/input|textarea|select/i.test(e.target.tagName) && undoState) { e.preventDefault(); undo(); return; }
    if (!$("#pal").hidden) { if (e.key === "Escape") closePal(); else if (e.key === "ArrowDown") { pal.sel = Math.min(pal.sel + 1, pal.list.length - 1); drawPal(); e.preventDefault(); } else if (e.key === "ArrowUp") { pal.sel = Math.max(pal.sel - 1, 0); drawPal(); e.preventDefault(); } else if (e.key === "Enter" && pal.list[pal.sel]) { const f = pal.list[pal.sel][2]; closePal(); f(); } return; }
    if (e.key === "Escape" && !$("#sheet").hidden) { requestClose(); return; }
    const typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
    if (!typing && $("#sheet").hidden && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === "/") { e.preventDefault(); const q = $("#q"); if (q && q.offsetParent) q.focus(); else openPal(); return; }
      if (e.key === "n" || e.key === "N") { const M = MOD[view.m]; if (M && M.nw && !rec) { e.preventDefault(); NEW[M.nw[0]](); } else if (view.m === "home") { e.preventDefault(); openPal(); } return; }
      if (e.key === "?") { e.preventDefault(); shortcuts(); return; }
      if (e.key === "[") { e.preventDefault(); toggleRail(); return; }
    }
    if (e.key === "Enter" && e.target.id === "q") { const hits = E.search(e.target.value); if (hits[0]) { $("#qres").hidden = true; open(hits[0].c, hits[0].id); } }
  });
  window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { try { E = STSEngine.createEngine(JSON.parse(e.newValue)); render(); } catch (err) {} } });
  async function exportData() {
    const data = JSON.stringify(E.S, null, 1); const filename = `sts-erp-demo-${T()}.json`;
    try { const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; if (dl) { await dl.save({ filename, data }); toast("Export ready", "ok"); return; } } catch (err) {}
    try { const blob = new Blob([data], { type: "application/json" }); const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast("Exported " + filename, "ok"); }
    catch (err) { sheet(`<div class="sts-stack"><div class="sts-rec-title">Copy your data</div><textarea class="sts-input" style="height:300px;font-family:var(--font-mono);font-size:11px">${esc(data)}</textarea><button class="sts-btn" data-close="1">Close</button></div>`); }
  }
  render(); if (window.__dataUpdated) { save(); toast("The practice copy was updated with new demo data (stock levels, contacts, expenses).", "ok"); }
  window.STSApp = { E: () => E, act, open, go, render, undo, tasks };
})();
</script>
</body>
